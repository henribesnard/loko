<!-- @dsCard group="Spacing" viewport="700x140" subtitle="Sober elevation — no colored glows" name="Radius & shadow" -->
<html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);padding:18px;display:flex;gap:16px;background:#FAFBFA}
.card{width:100px;height:88px;background:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:11px;color:#545C59}
</style></head>
<body>
<div class="card" style="border-radius:8px;box-shadow:0 1px 2px rgba(24,27,26,.08),0 1px 1px rgba(24,27,26,.04)">sm</div>
<div class="card" style="border-radius:12px;box-shadow:0 4px 12px rgba(24,27,26,.1),0 2px 4px rgba(24,27,26,.06)">md</div>
<div class="card" style="border-radius:16px;box-shadow:0 12px 32px rgba(24,27,26,.14),0 4px 10px rgba(24,27,26,.08)">lg</div>
<div class="card" style="border-radius:24px;border:1px solid #DBE0DE">xl (border only)</div>
</body></html>
