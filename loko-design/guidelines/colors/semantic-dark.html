<html><head><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;font-family:var(--font-sans);display:flex;gap:10px;padding:14px;background:#0D0F0E}
.c{flex:1;border-radius:10px;padding:14px;font-size:12px;font-weight:600;border:1px solid}
.l{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.04em;opacity:.8;display:block;margin-bottom:6px}
</style></head>
<body>
<div class="c" style="background:#12251F;color:#6FC0A2;border-color:#1D3B32"><span class="l">Success</span>Traité avec succès</div>
<div class="c" style="background:#14232B;color:#8FC1DE;border-color:#223B48"><span class="l">Info</span>Nécessite une clarification</div>
<div class="c" style="background:#2B2213;color:#E6B966;border-color:#4A3B20"><span class="l">Warning</span>Source documentaire ambiguë</div>
<div class="c" style="background:#2B1815;color:#E68B76;border-color:#4A2921"><span class="l">Error</span>Aucune réponse fiable trouvée</div>
</body></html>
