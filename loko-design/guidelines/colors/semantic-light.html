<html><head><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;font-family:var(--font-sans);display:flex;gap:10px;padding:14px}
.c{flex:1;border-radius:10px;padding:14px;font-size:12px;font-weight:600;border:1px solid}

</style></head>
<body>
<div class="c" style="background:#EAF6F1;color:#0A5142;border-color:#A0D7C2"><span class="l">Success</span>Traité avec succès</div>
<div class="c" style="background:#E7F0F4;color:#2A5468;border-color:#C7DCE5"><span class="l">Info</span>Nécessite une clarification</div>
<div class="c" style="background:#FBF0DA;color:#7A5518;border-color:#EBD3A0"><span class="l">Warning</span>Source documentaire ambiguë</div>
<div class="c" style="background:#FBE9E6;color:#832C1B;border-color:#E8C1B8"><span class="l">Error</span>Aucune réponse fiable trouvée</div>
