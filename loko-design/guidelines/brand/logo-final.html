<!-- @dsCard group="Brand" viewport="900x360" subtitle="Glyph, lockup, app icon — color / mono" name="Logo — final system" -->
<html>
<head>
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--gray-0);color:var(--gray-900);padding:24px;}
  .row{display:flex;gap:20px;align-items:center;margin-bottom:18px;}
  .cell{border-radius:10px;display:flex;align-items:center;justify-content:center;padding:16px;}
  .light{background:var(--gray-50);border:1px solid var(--gray-200);}
  .dark{background:var(--gray-900);}
  label{font-size:11px;color:var(--gray-500);width:150px;flex:none;}
</style>
</head>
<body>
  <div class="row">
    <label>Glyphe — app icon</label>
    <div class="cell light"><img src="../assets/logo/glyph-color.svg" width="48" height="48"></div>
    <div class="cell light"><img src="../assets/logo/glyph-color.svg" width="24" height="24"></div>
    <div class="cell light"><img src="../assets/logo/glyph-color.svg" width="16" height="16"></div>
  </div>
  <div class="row">
    <label>Lockup — couleur</label>
    <div class="cell light" style="padding:14px 20px"><img src="../assets/logo/lockup-horizontal-color.svg" height="34"></div>
  </div>
  <div class="row">
    <label>Mono — noir</label>
    <div class="cell light" style="padding:14px 20px"><img src="../assets/logo/lockup-horizontal-mono-black.svg" height="34"></div>
    <div class="cell light"><img src="../assets/logo/glyph-mono-black.svg" width="40" height="40"></div>
  </div>
  <div class="row">
    <label>Mono — blanc</label>
    <div class="cell dark" style="padding:14px 20px"><img src="../assets/logo/lockup-horizontal-mono-white.svg" height="34"></div>
    <div class="cell dark"><img src="../assets/logo/glyph-mono-white.svg" width="40" height="40"></div>
  </div>
</body>
</html>
