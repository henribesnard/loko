<!-- @dsCard group="Chatbot Widget" viewport="1280x760" subtitle="Floating launcher + conversation window, on a sample client site — light & dark" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>LOKO — Chatbot widget</title>
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-sans); }
  ::placeholder { color: var(--text-tertiary); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react" data-plugins="transform-react-jsx">
const { useState } = React;

function ChatLauncher({ open, onClick, unread }) {
  return (
    <button onClick={onClick} aria-label={open ? 'Fermer le chat' : 'Ouvrir le chat'}
      style={{ width:56, height:56, borderRadius:'var(--radius-tile)', border:'none', background:'var(--brand-primary)',
        boxShadow:'var(--shadow-lg)', cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center',
        position:'relative', transition:'transform 200ms var(--ease-standard)' }}>
      {open ? (
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M4 4L16 16M16 4L4 16" stroke="var(--text-on-brand)" strokeWidth="2" strokeLinecap="round"/>
        </svg>
      ) : (
        <svg width="22" height="22" viewBox="0 0 64 64">
          <path fillRule="evenodd" fill="var(--text-on-brand)" d="M 32 32 m -18 0 a 18 18 0 1 0 36 0 a 18 18 0 1 0 -36 0 Z M 28.5 29 h7 a3 3 0 0 1 3 3 v10 a3 3 0 0 1 -3 3 h-7 a3 3 0 0 1 -3 -3 v-10 a3 3 0 0 1 3 -3 Z"/>
        </svg>
      )}
      {!open && unread > 0 && (
        <span style={{ position:'absolute', top:-2, right:-2, minWidth:18, height:18, padding:'0 4px',
          borderRadius:'var(--radius-pill)', background:'var(--accent-primary)', color:'#fff', fontFamily:'var(--font-mono)',
          fontSize:10, fontWeight:600, display:'flex', alignItems:'center', justifyContent:'center', border:'2px solid var(--surface-page)' }}>
          {unread}
        </span>
      )}
    </button>
  );
}

function MessageBubble({ from = 'bot', children, traceLabel }) {
  const isBot = from === 'bot';
  return (
    <div style={{ display:'flex', flexDirection:'column', alignItems: isBot ? 'flex-start' : 'flex-end', gap:4 }}>
      <div style={{ maxWidth:'82%', padding:'10px 14px', borderRadius: isBot ? '4px 14px 14px 14px' : '14px 4px 14px 14px',
        background: isBot ? 'var(--surface-sunken)' : 'var(--brand-primary)', color: isBot ? 'var(--text-primary)' : 'var(--text-on-brand)',
        border: isBot ? '1px solid var(--border-subtle)' : 'none', fontSize:'var(--text-body-sm)', lineHeight:'var(--leading-normal)' }}>
        {children}
      </div>
      {traceLabel && isBot && (
        <div style={{ fontFamily:'var(--font-mono)', fontSize:10.5, color:'var(--text-tertiary)', padding:'0 4px', display:'flex', alignItems:'center', gap:4 }}>
          <span style={{ width:4, height:4, borderRadius:'50%', background:'var(--brand-primary)' }}/>{traceLabel}
        </div>
      )}
    </div>
  );
}

function ChoiceButtons({ options, onSelect, selected }) {
  return (
    <div style={{ display:'flex', flexWrap:'wrap', gap:8, paddingLeft:2 }}>
      {options.map(opt => {
        const isSelected = selected === opt;
        return (
          <button key={opt} onClick={() => onSelect(opt)} disabled={selected != null}
            style={{ padding:'8px 14px', borderRadius:'var(--radius-pill)', border:'1px solid',
              borderColor: isSelected ? 'var(--brand-primary)' : 'var(--border-default)',
              background: isSelected ? 'var(--brand-primary-tint)' : 'var(--surface-card)',
              color: isSelected ? 'var(--green-700)' : 'var(--text-primary)', fontSize:'var(--text-body-sm)', fontWeight:500,
              cursor: selected == null ? 'pointer' : 'default', opacity: selected != null && !isSelected ? 0.45 : 1 }}>
            {opt}
          </button>
        );
      })}
    </div>
  );
}

function StreamingIndicator() {
  return (
    <div style={{ display:'inline-flex', gap:5, padding:'11px 14px', borderRadius:'4px 14px 14px 14px',
      background:'var(--surface-sunken)', border:'1px solid var(--border-subtle)', width:'fit-content' }}>
      {[0,1,2].map(i => (
        <span key={i} style={{ width:5, height:5, borderRadius:'50%', background:'var(--text-tertiary)',
          animation:`loko-pulse 1.1s ${i*0.15}s ease-in-out infinite` }}/>
      ))}
    </div>
  );
}

function ChatWidget({ theme }) {
  const [open, setOpen] = useState(true);
  const [answer, setAnswer] = useState(null);
  const [showTrace, setShowTrace] = useState(false);

  return (
    <div data-theme={theme} style={{ position:'absolute', inset:0, pointerEvents:'none' }}>
      <div style={{ position:'absolute', right:24, bottom:96, width:360, maxHeight:500, borderRadius:'var(--radius-xl)',
        background:'var(--surface-card)', border:'1px solid var(--border-subtle)', boxShadow:'var(--shadow-lg)',
        display: open ? 'flex' : 'none', flexDirection:'column', overflow:'hidden', pointerEvents:'auto' }}>
        <div style={{ display:'flex', alignItems:'center', gap:10, padding:'14px 16px', borderBottom:'1px solid var(--border-subtle)' }}>
          <svg width="26" height="26" viewBox="0 0 64 64">
            <rect x="1" y="1" width="62" height="62" rx="14" fill="var(--brand-primary)"/>
            <path fillRule="evenodd" fill="var(--text-on-brand)" d="M 32 32 m -18 0 a 18 18 0 1 0 36 0 a 18 18 0 1 0 -36 0 Z M 28.5 29 h7 a3 3 0 0 1 3 3 v10 a3 3 0 0 1 -3 3 h-7 a3 3 0 0 1 -3 -3 v-10 a3 3 0 0 1 3 -3 Z"/>
          </svg>
          <div style={{ flex:1 }}>
            <div style={{ fontSize:14, fontWeight:600, color:'var(--text-primary)' }}>Assistant Loko</div>
            <div style={{ fontSize:11.5, color:'var(--text-tertiary)', display:'flex', alignItems:'center', gap:5 }}>
              <span style={{ width:6, height:6, borderRadius:'50%', background:'var(--brand-primary)' }}/>
              En ligne — données traitées localement
            </div>
          </div>
          <button onClick={() => setShowTrace(s => !s)} title="Voir pourquoi le bot répond ceci"
            style={{ width:26, height:26, borderRadius:'var(--radius-sm)', border:'1px solid var(--border-default)',
              background: showTrace ? 'var(--brand-primary-tint)' : 'transparent', color:'var(--text-secondary)', fontFamily:'var(--font-mono)', fontSize:12, cursor:'pointer' }}>
            i
          </button>
        </div>
        <div style={{ flex:1, padding:16, display:'flex', flexDirection:'column', gap:12, overflowY:'auto', background:'var(--surface-page)' }}>
          <MessageBubble from="bot">Bonjour 👋 Comment puis-je vous aider aujourd'hui ?</MessageBubble>
          <MessageBubble from="user">J'ai un souci avec ma dernière commande.</MessageBubble>
          <MessageBubble from="bot" traceLabel={showTrace ? 'state.qualify_issue · cgv-2026.pdf' : undefined}>
            Bien sûr. De quel type de demande s'agit-il ?
          </MessageBubble>
          <ChoiceButtons options={['Livraison','Retour','Facturation']} onSelect={setAnswer} selected={answer} />
          {answer && (
            <MessageBubble from="bot" traceLabel={showTrace ? `state.confirm_${answer.toLowerCase()} · 0.94` : undefined}>
              {answer === 'Retour' ? 'Le retour est possible si la commande a moins de 30 jours. Voulez-vous démarrer la procédure ?'
                : answer === 'Livraison' ? "Votre colis est en cours d'acheminement. Je peux vous donner le suivi si vous avez le numéro de commande."
                : 'Je peux vous montrer le détail de la dernière facture émise.'}
            </MessageBubble>
          )}
          {!answer && <StreamingIndicator/>}
        </div>
        <div style={{ display:'flex', gap:8, padding:12, borderTop:'1px solid var(--border-subtle)' }}>
          <input placeholder="Écrire un message…" style={{ flex:1, border:'1px solid var(--border-default)', borderRadius:'var(--radius-pill)',
            padding:'9px 14px', fontSize:13.5, fontFamily:'var(--font-sans)', background:'var(--surface-card)', color:'var(--text-primary)', outline:'none' }}/>
          <button style={{ width:36, height:36, borderRadius:'50%', border:'none', background:'var(--brand-primary)', color:'var(--text-on-brand)', cursor:'pointer' }}>→</button>
        </div>
      </div>
      <div style={{ position:'absolute', right:24, bottom:24, pointerEvents:'auto' }}>
        <ChatLauncher open={open} onClick={() => setOpen(o => !o)} unread={open ? 0 : 1} />
      </div>
    </div>
  );
}

function ClientSite({ theme }) {
  return (
    <div data-theme={theme} style={{ background:'var(--surface-page)', color:'var(--text-primary)', minHeight:'100%' }}>
      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'20px 48px', borderBottom:'1px solid var(--border-subtle)' }}>
        <div style={{ display:'flex', alignItems:'center', gap:10, fontWeight:600, fontSize:15, color:'var(--text-secondary)' }}>
          Nordique Maison — service client
        </div>
        <div style={{ display:'flex', gap:28, fontSize:13.5, color:'var(--text-secondary)' }}>
          <span>Catalogue</span><span>Livraison</span><span>Aide</span><span>Compte</span>
        </div>
      </div>
      <div style={{ padding:'80px 48px', maxWidth:640 }}>
        <div style={{ fontSize:'var(--text-h1)', fontWeight:600, letterSpacing:'var(--tracking-tight)', marginBottom:16 }}>
          Besoin d'aide sur une commande ?
        </div>
        <div style={{ fontSize:'var(--text-body-lg)', color:'var(--text-secondary)', lineHeight:'var(--leading-relaxed)' }}>
          L'assistant en bas à droite peut répondre à partir de nos CGV et de votre historique — chaque réponse cite sa source.
        </div>
      </div>
    </div>
  );
}

function App() {
  const [theme, setTheme] = useState('light');
  return (
    <div>
      <div style={{ display:'flex', justifyContent:'center', gap:8, padding:'14px 0', background: theme==='dark' ? '#0D0F0E' : '#F5F7F6' }}>
        {['light','dark'].map(t => (
          <button key={t} onClick={() => setTheme(t)}
            style={{ padding:'7px 16px', borderRadius:999, border:'1px solid ' + (theme===t ? '#0F7D63' : '#DBE0DE'),
              background: theme===t ? '#0F7D63' : 'transparent', color: theme===t ? '#fff' : (theme==='dark' ? '#ccc' : '#3D4341'),
              fontFamily:'Geist, sans-serif', fontSize:13, fontWeight:500, cursor:'pointer', textTransform:'capitalize' }}>
            {t}
          </button>
        ))}
      </div>
      <div style={{ position:'relative', height:700 }}>
        <ClientSite theme={theme} />
        <ChatWidget theme={theme} />
      </div>
      <style>{`@keyframes loko-pulse { 0%, 100% { opacity: 0.3; } 40% { opacity: 0.9; } }`}</style>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
