<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="styles.css">
</helmet>
<div data-theme="{{ theme }}" style="font-family:var(--font-sans); background:var(--surface-page); min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px; color:var(--text-primary);">

  <button onClick="{{ toggleTheme }}" style="position:absolute; top:20px; right:24px; border:1px solid var(--border-default); background:transparent; color:var(--text-secondary); border-radius:var(--radius-sm); padding:6px 11px; font-size:12px; cursor:pointer;">{{ themeLabel }}</button>

  <a href="#" style="display:flex; align-items:center; gap:10px; text-decoration:none; margin-bottom:32px;">
    <svg width="24" height="24" viewBox="0 0 64 64"><rect x="1" y="1" width="62" height="62" rx="14" fill="var(--brand-primary)"/><circle cx="32" cy="25" r="10" fill="none" stroke="var(--text-on-brand)" stroke-width="4"/><path d="M32 33 L32 44" stroke="var(--text-on-brand)" stroke-width="4" stroke-linecap="round"/></svg>
    <span style="font-size:16px; font-weight:600; color:var(--text-primary);">LOKO</span>
  </a>

  <div style="width:100%; max-width:400px; background:var(--surface-card); border:1px solid var(--border-subtle); border-radius:var(--radius-xl); box-shadow:var(--shadow-md); padding:32px;">
    <div style="font-size:20px; font-weight:600; margin-bottom:6px; letter-spacing:var(--tracking-tight);">Créer un compte</div>
    <div style="font-size:13px; color:var(--text-secondary); margin-bottom:24px;">Configurez votre premier bot en quelques minutes.</div>

    <div style="display:flex; flex-direction:column; gap:16px;">
      <div>
        <label style="display:block; font-size:12.5px; font-weight:600; margin-bottom:6px;">Nom de l'organisation</label>
        <input value="{{ orgName }}" onChange="{{ onOrgNameChange }}" placeholder="Mutuelle Verdier" style="width:100%; box-sizing:border-box; padding:10px 12px; border-radius:var(--radius-sm); border:1px solid var(--border-default); background:var(--surface-page); color:var(--text-primary); font-size:13.5px; font-family:var(--font-sans);" />
      </div>
      <div>
        <label style="display:block; font-size:12.5px; font-weight:600; margin-bottom:6px;">E-mail professionnel</label>
        <input value="{{ email }}" onChange="{{ onEmailChange }}" placeholder="vous@organisation.fr" style="width:100%; box-sizing:border-box; padding:10px 12px; border-radius:var(--radius-sm); border:1px solid var(--border-default); background:var(--surface-page); color:var(--text-primary); font-size:13.5px; font-family:var(--font-sans);" />
      </div>
      <div>
        <label style="display:block; font-size:12.5px; font-weight:600; margin-bottom:6px;">Mot de passe</label>
        <input type="password" value="{{ password }}" onChange="{{ onPasswordChange }}" style="width:100%; box-sizing:border-box; padding:10px 12px; border-radius:var(--radius-sm); border:1px solid var(--border-default); background:var(--surface-page); color:var(--text-primary); font-size:13.5px; font-family:var(--font-sans);" />
        <sc-if value="{{ showStrength }}">
          <div style="margin-top:8px; display:flex; flex-direction:column; gap:5px;">
            <div style="height:4px; border-radius:999px; background:var(--gray-200); overflow:hidden;">
              <div style="height:100%; width:{{ strengthPct }}; background:{{ strengthColor }}; transition:width 200ms;"></div>
            </div>
            <div style="font-size:11.5px; color:{{ strengthColor }};">{{ strengthLabel }}</div>
          </div>
        </sc-if>
      </div>

      <label style="display:flex; align-items:flex-start; gap:9px; font-size:12.5px; color:var(--text-secondary); cursor:pointer;">
        <input type="checkbox" checked="{{ tosChecked }}" onChange="{{ onTosToggle }}" style="margin-top:2px; accent-color:var(--brand-primary);" />
        <span>J'accepte les <a href="#" style="color:var(--text-link);">conditions générales</a> et la <a href="#" style="color:var(--text-link);">politique de confidentialité</a>.</span>
      </label>

      <button onClick="{{ onSubmit }}" disabled="{{ submitDisabled }}" style="width:100%; box-sizing:border-box; padding:11px; border-radius:var(--radius-md); border:none; background:{{ submitBg }}; color:var(--text-on-brand); font-size:14px; font-weight:600; cursor:{{ submitCursor }};">Créer mon compte</button>
    </div>

    <div style="text-align:center; margin-top:20px; font-size:13px; color:var(--text-secondary);">Déjà un compte ? <a href="#" style="color:var(--text-link); font-weight:500;">Se connecter</a></div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = {
    theme: 'light',
    orgName: '',
    email: '',
    password: '',
    tosChecked: false,
  };

  toggleTheme = () => this.setState(s => ({ theme: s.theme === 'light' ? 'dark' : 'light' }));
  onOrgNameChange = (e) => this.setState({ orgName: e.target.value });
  onEmailChange = (e) => this.setState({ email: e.target.value });
  onPasswordChange = (e) => this.setState({ password: e.target.value });
  onTosToggle = () => this.setState(s => ({ tosChecked: !s.tosChecked }));
  onSubmit = () => {};

  strength(pw) {
    if (!pw) return { level: 0, label: '', color: 'var(--gray-300)' };
    let score = 0;
    if (pw.length >= 8) score++;
    if (pw.length >= 12) score++;
    if (/[0-9]/.test(pw) && /[a-zA-Z]/.test(pw)) score++;
    if (/[^a-zA-Z0-9]/.test(pw)) score++;
    if (score <= 1) return { level: 1, label: 'Faible', color: 'var(--error-fg)' };
    if (score <= 2) return { level: 2, label: 'Moyen', color: 'var(--warning-fg)' };
    return { level: 3, label: 'Robuste', color: 'var(--success-fg)' };
  }

  renderVals() {
    const { theme, orgName, email, password, tosChecked } = this.state;
    const st = this.strength(password);
    const canSubmit = !!orgName && !!email && password.length >= 8 && tosChecked;

    return {
      theme,
      themeLabel: theme === 'light' ? '◐ Sombre' : '◑ Clair',
      toggleTheme: this.toggleTheme,
      orgName, onOrgNameChange: this.onOrgNameChange,
      email, onEmailChange: this.onEmailChange,
      password, onPasswordChange: this.onPasswordChange,
      showStrength: password.length > 0,
      strengthPct: `${(st.level / 3) * 100}%`,
      strengthColor: st.color,
      strengthLabel: st.label,
      tosChecked, onTosToggle: this.onTosToggle,
      onSubmit: this.onSubmit,
      submitDisabled: !canSubmit,
      submitBg: canSubmit ? 'var(--brand-primary)' : 'var(--gray-300)',
      submitCursor: canSubmit ? 'pointer' : 'default',
    };
  }
}

</script>
</body>
</html>
