<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="font-family:var(--font-sans, sans-serif); background:#F5F7F6; padding:40px; display:flex; flex-direction:column; gap:32px; align-items:center;">

  <sc-for list="{{ emails }}" as="mail" hint-placeholder-count="3">
    <div style="width:520px; background:#ffffff; border:1px solid #DBE0DE; border-radius:8px; overflow:hidden;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;">
        <tr>
          <td style="padding:28px 32px 20px; border-bottom:1px solid #EBEEED;">
            <table role="presentation" cellpadding="0" cellspacing="0"><tr>
              <td style="padding-right:10px;">
                <svg width="26" height="26" viewBox="0 0 64 64"><rect x="1" y="1" width="62" height="62" rx="14" fill="#0F7D63"/><circle cx="32" cy="25" r="10" fill="none" stroke="#ffffff" stroke-width="4"/><path d="M32 33 L32 44" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/></svg>
              </td>
              <td style="font-family:Geist, Arial, sans-serif; font-size:15px; font-weight:600; color:#181B1A;">LOKO</td>
            </tr></table>
          </td>
        </tr>
        <tr>
          <td style="padding:28px 32px;">
            <div style="font-family:Geist, Arial, sans-serif; font-size:18px; font-weight:600; color:#181B1A; margin-bottom:14px;">{{ mail.title }}</div>
            <div style="font-family:Geist, Arial, sans-serif; font-size:14px; color:#3D4341; line-height:1.6; margin-bottom:24px;">{{ mail.body }}</div>
            <table role="presentation" cellpadding="0" cellspacing="0"><tr>
              <td style="border-radius:8px; background:#0F7D63;">
                <a href="#" style="display:inline-block; padding:12px 24px; font-family:Geist, Arial, sans-serif; font-size:14px; font-weight:600; color:#ffffff; text-decoration:none;">{{ mail.buttonLabel }}</a>
              </td>
            </tr></table>
            <div style="font-family:Geist, Arial, sans-serif; font-size:11.5px; color:#98A19D; margin-top:20px; line-height:1.6;">Si le bouton ne fonctionne pas, copiez ce lien dans votre navigateur :<br/><span style="color:#0A5142;">{{ mail.linkText }}</span></div>
          </td>
        </tr>
        <tr>
          <td style="padding:18px 32px; background:#FAFBFA; border-top:1px solid #EBEEED;">
            <div style="font-family:Geist, Arial, sans-serif; font-size:11px; color:#98A19D; line-height:1.6;">LOKO — plateforme de chatbot déterministe. Vos données restent en Europe.<br/><a href="#" style="color:#98A19D;">Mentions légales</a> · <a href="#" style="color:#98A19D;">Confidentialité</a></div>
          </td>
        </tr>
      </table>
    </div>
    <div style="font-family:var(--font-mono, monospace); font-size:11px; color:#717A77; margin-top:-16px;">{{ mail.name }}</div>
  </sc-for>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      emails: [
        {
          name: 'verification.html',
          title: 'Vérifiez votre adresse e-mail',
          body: 'Merci de votre inscription à LOKO. Cliquez sur le bouton ci-dessous pour vérifier votre adresse et activer votre compte. Ce lien expire dans 24 heures.',
          buttonLabel: 'Vérifier mon adresse',
          linkText: 'https://app.loko.eu/verify?token=7f3a9c2e',
        },
        {
          name: 'reset-password.html',
          title: 'Réinitialisez votre mot de passe',
          body: 'Vous avez demandé la réinitialisation de votre mot de passe. Cliquez sur le bouton ci-dessous pour en choisir un nouveau. Si vous n’êtes pas à l’origine de cette demande, ignorez cet e-mail.',
          buttonLabel: 'Réinitialiser mon mot de passe',
          linkText: 'https://app.loko.eu/reset?token=b6d4f8e9',
        },
        {
          name: 'password-changed.html',
          title: 'Votre mot de passe a été modifié',
          body: 'Ceci confirme que le mot de passe de votre compte LOKO vient d’être changé. Si vous n’êtes pas à l’origine de cette action, contactez-nous immédiatement.',
          buttonLabel: 'Accéder à mon compte',
          linkText: 'https://app.loko.eu/login',
        },
      ],
    };
  }
}

</script>
</body>
</html>
